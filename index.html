<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Flappy Nyan Cat</title>
<style>
  html, body { margin: 0; height: 100%; background: #001b3a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-height: 100vh; max-width: 100vw; touch-action: none; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const GRAVITY = 0.32, FLAP = -5.6, MAX_FALL = 4, SPEED = 4.2;
const GAP = 210, PIPE_W = 60, PIPE_EVERY = 670, MAX_SHIFT = 130;
const CAT_W = 44, CAT_H = 32, CAT_X = 90;
const RAINBOW = ['#f00', '#f90', '#ff0', '#3f0', '#09f', '#63f'];

let state, cat, pipes, stars, trail, score, best, frame;
best = +(localStorage.getItem('nyanBest') || 0);

function reset() {
  cat = { y: H / 2, vy: 0 };
  pipes = [];
  trail = [];
  score = 0;
  frame = 0;
  state = 'ready';
  if (!stars) {
    stars = Array.from({ length: 40 }, () => ({
      x: Math.random() * W, y: Math.random() * H, s: 1 + Math.random() * 2
    }));
  }
}

function flap() {
  if (state === 'dead') { if (frame > 30) reset(); return; }
  if (state === 'ready') state = 'play';
  cat.vy = FLAP;
  beep(660, 0.06);
}

// tiny sound effects
let actx;
function beep(freq, dur) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.value = 0.04;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

function die() {
  state = 'dead';
  frame = 0;
  beep(120, 0.3);
  if (score > best) { best = score; try { localStorage.setItem('nyanBest', best); } catch (e) {} }
}

function update() {
  frame++;
  stars.forEach(s => { s.x -= s.s * (state === 'dead' ? 0 : 1); if (s.x < 0) { s.x = W; s.y = Math.random() * H; } });
  if (state === 'ready') { cat.y = H / 2 + Math.sin(frame / 15) * 8; return; }
  if (state === 'dead') { return; }

  cat.vy = Math.min(cat.vy + GRAVITY, MAX_FALL);
  cat.y += cat.vy;

  trail.unshift(cat.y);
  if (trail.length > 30) trail.pop();

  const last = pipes[pipes.length - 1];
  if (!last || last.x <= W - PIPE_EVERY) {
    // keep each gap reachable from the previous one
    const lo = 60, hi = H - GAP - 60;
    const prev = last ? last.top : (lo + hi) / 2;
    const top = Math.max(lo, Math.min(hi, prev + (Math.random() * 2 - 1) * MAX_SHIFT));
    pipes.push({ x: last ? last.x + PIPE_EVERY : W + 60, top, scored: false });
  }
  pipes.forEach(p => p.x -= SPEED);
  pipes = pipes.filter(p => p.x > -PIPE_W);

  const bx = CAT_X + 8, by = cat.y - CAT_H / 2 + 8, bw = CAT_W - 16, bh = CAT_H - 14;
  for (const p of pipes) {
    if (bx + bw > p.x && bx < p.x + PIPE_W && (by < p.top || by + bh > p.top + GAP)) die();
    if (!p.scored && p.x + PIPE_W < CAT_X) { p.scored = true; score++; beep(880, 0.08); }
  }
  if (cat.y - CAT_H / 2 < 0 || cat.y + CAT_H / 2 > H) die();
}

function drawPipe(p) {
  const draw = (y, h) => {
    ctx.fillStyle = '#ff9ecf';
    ctx.fillRect(p.x, y, PIPE_W, h);
    ctx.fillStyle = '#ff5fa8';
    for (let i = -PIPE_W; i < h + PIPE_W; i += 24) {
      ctx.save();
      ctx.beginPath(); ctx.rect(p.x, y, PIPE_W, h); ctx.clip();
      ctx.beginPath();
      ctx.moveTo(p.x, y + i); ctx.lineTo(p.x + PIPE_W, y + i - PIPE_W * 0.6);
      ctx.lineTo(p.x + PIPE_W, y + i - PIPE_W * 0.6 + 10); ctx.lineTo(p.x, y + i + 10);
      ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeRect(p.x, y, PIPE_W, h);
  };
  draw(0, p.top);
  draw(p.top + GAP, H - p.top - GAP);
}

function drawCat(x, y, tilt) {
  ctx.save();
  ctx.translate(x + CAT_W / 2, y);
  ctx.rotate(tilt);
  ctx.translate(-CAT_W / 2, -CAT_H / 2);
  const bob = Math.floor(frame / 6) % 2;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  // tail
  ctx.fillStyle = '#999';
  ctx.fillRect(-8, 12 + bob, 10, 6);
  // pop-tart
  ctx.fillStyle = '#f7d9a0'; ctx.fillRect(4, 2, 30, 26); ctx.strokeRect(4, 2, 30, 26);
  ctx.fillStyle = '#ff8fc8'; ctx.fillRect(7, 5, 24, 20);
  ctx.fillStyle = '#e0407f';
  [[10, 9], [22, 8], [15, 16], [26, 19], [10, 20]].forEach(([sx, sy]) => ctx.fillRect(sx, sy, 2, 2));
  // legs
  ctx.fillStyle = '#999';
  [8, 14, 26, 32].forEach((lx, i) => ctx.fillRect(lx, 27 + ((i + bob) % 2), 5, 5));
  // head
  ctx.fillStyle = '#999'; ctx.fillRect(24, 8, 20, 17); ctx.strokeRect(24, 8, 20, 17);
  // ears
  ctx.beginPath(); ctx.moveTo(26, 8); ctx.lineTo(28, 1); ctx.lineTo(33, 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(37, 8); ctx.lineTo(41, 1); ctx.lineTo(43, 8); ctx.fill();
  // face
  ctx.fillStyle = '#000';
  ctx.fillRect(29, 13, 3, 3); ctx.fillRect(38, 13, 3, 3);
  ctx.fillRect(33, 19, 5, 1);
  ctx.fillStyle = '#ffb3c8';
  ctx.fillRect(26, 18, 3, 3); ctx.fillRect(41, 18, 3, 3);
  ctx.restore();
}

function drawTrail() {
  const stripe = 5;
  const total = stripe * RAINBOW.length;
  for (let i = trail.length - 1; i >= 0; i--) {
    const x = CAT_X + 6 - i * SPEED;
    const wave = Math.sin((i + frame) / 3) * 2;
    RAINBOW.forEach((c, k) => {
      ctx.fillStyle = c;
      ctx.fillRect(x, trail[i] - total / 2 + k * stripe + wave, SPEED + 1, stripe);
    });
  }
}

function text(str, x, y, size, color = '#fff') {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = '#000';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function draw() {
  ctx.fillStyle = '#003366'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
  pipes.forEach(drawPipe);
  drawTrail();
  const tilt = state === 'ready' ? 0 : Math.max(-0.4, Math.min(0.6, cat.vy / 14));
  drawCat(CAT_X, cat.y, tilt);

  if (state === 'ready') {
    text('FLAPPY NYAN', W / 2, 150, 36, '#ff9ecf');
    text('Tap / Space / Click to flap', W / 2, 420, 16);
    text('nyan nyan nyan nyan...', W / 2, 445, 14, '#9cf');
  } else {
    text(score, W / 2, 60, 44);
  }
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    text('GAME OVER', W / 2, 230, 40, '#f55');
    text('Score: ' + score, W / 2, 285, 24);
    text('Best: ' + best, W / 2, 320, 24, '#ff0');
    if (frame > 30) text('Tap to retry', W / 2, 380, 18);
  }
}

// fixed 60 updates/sec regardless of monitor refresh rate
let last = 0, acc = 0;
const STEP = 1000 / 60;
function loop(t) {
  acc += Math.min(t - (last || t), 100);
  last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}

addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) flap(); } });
cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
